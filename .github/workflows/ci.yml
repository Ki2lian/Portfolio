# The project's checks: lint, build the production image, start it and see it answer. Runs on pull requests, and is
# called by dependabot-auto-merge.yml, whose merge waits for this result.
#
# CHANGE per project: the steps (this one is a Next.js app built as a Docker image, pnpm), the image name in the smoke
# test and the port. Keep the `if` and the `workflow_call` input: they are the contract with the auto-merge workflow.
name: CI

on:
    pull_request:
    workflow_call:
        inputs:
            dependabot:
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    checks:
        # A Dependabot pull request is checked through dependabot-auto-merge.yml (which passes `dependabot: true`), not by
        # this direct trigger: otherwise the checks would run twice.
        if: inputs.dependabot || github.actor != 'dependabot[bot]'
        name: Lint, build, smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Reads the pnpm version from "packageManager" in package.json.
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  cache: pnpm
                  node-version-file: package.json
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build the image (not pushed)
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  build-args: NEXT_DEPLOYMENT_ID=ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  load: true
                  provenance: false
                  tags: app:ci

            # Same checks as the server's deploy: the container must become healthy and serve a page. This is what
            # lets a dependency update be merged without a human looking at it.
            - name: Smoke test
              run: |
                  docker run -d --name smoke -p 3000:3000 app:ci
                  for i in $(seq 1 30); do
                      [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
                      sleep 1
                  done
                  [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] || { docker logs smoke; exit 1; }
                  curl -fsS -o /dev/null http://127.0.0.1:3000/fr
