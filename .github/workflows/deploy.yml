# On every push to main: lint, build the image on GitHub (the VPS never compiles), push it to the private GHCR
# registry tagged with the commit SHA, then ask the VPS to deploy that tag.
#
# The VPS side (app-deploy in the vps-infra repository) pulls the image, waits for the container to be healthy and
# puts the previous version back if it is not. If that happens the last step fails and this run turns red.
name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# Never two deploys at once, and never cancel one that is running (it could stop halfway).
concurrency:
    cancel-in-progress: false
    group: deploy

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/ki2lian/portfolio

jobs:
    deploy:
        name: Lint, build, deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            # Reads the pnpm version from "packageManager" in package.json.
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  cache: pnpm
                  node-version-file: package.json
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  password: ${{ secrets.GITHUB_TOKEN }}
                  registry: ghcr.io
                  username: ${{ github.actor }}
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  build-args: NEXT_DEPLOYMENT_ID=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  platforms: linux/amd64
                  provenance: false
                  push: true
                  tags: ${{ env.IMAGE }}:${{ github.sha }}

            - name: Deploy on the VPS
              env:
                  HOST: ${{ secrets.DEPLOY_HOST }}
                  KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  # The key can only run "deploy <tag>" for this app: that is all the server accepts from it.
                  ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "deploy@$HOST" "deploy ${{ github.sha }}"
