# On every push to main: lint, build the image on GitHub (the VPS never compiles), push it to the private GHCR
# registry tagged with the commit SHA, then ask the VPS to deploy that tag.
#
# The VPS side (app-deploy in the vps-infra repository) pulls the image, waits for the container to be healthy and
# puts the previous version back if it is not. If that happens the last step fails and this run turns red.
name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# Never two deploys at once, and never cancel one that is running (it could stop halfway).
concurrency:
    cancel-in-progress: false
    group: deploy

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/ki2lian/portfolio

jobs:
    deploy:
        name: Lint, build, deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Reads the pnpm version from "packageManager" in package.json.
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  cache: pnpm
                  node-version-file: package.json
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  password: ${{ secrets.GITHUB_TOKEN }}
                  registry: ghcr.io
                  username: ${{ github.actor }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  build-args: NEXT_DEPLOYMENT_ID=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  platforms: linux/amd64
                  provenance: false
                  push: true
                  tags: ${{ env.IMAGE }}:${{ github.sha }}

            - name: Deploy on the VPS
              env:
                  HOST: ${{ secrets.DEPLOY_HOST }}
                  KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  # The key can only run "deploy <tag>" for this app: that is all the server accepts from it.
                  ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "deploy@$HOST" "deploy ${{ github.sha }}"
