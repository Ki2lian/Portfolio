# Install scripts of dependencies are blocked by default. Each decision is explicit.
# All four only provide optional native fast paths or watchers; the build works without them.
allowBuilds:
    "@parcel/watcher": false
    "@swc/core": false
    "@tailwindcss/oxide": false
    unrs-resolver: false
# Next.js bundles postcss 8.4.31, which has known file-read and XSS issues (fixed upstream in 8.5.x).
overrides:
    postcss: ">=8.5.23"
